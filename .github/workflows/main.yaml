name: ci
on:
  push
  
# Environment
env:
  CI: true
  PYTHON_VERSION: 3.12

# Allow the job to push the regenerated CV PDF back to main
permissions:
  contents: write

# Jobs to run
jobs:

  # Build and deploy documentation site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:

      # Checkout source form GitHub (full history: cv/build.py dates the PDFs with the last
      # commit that touched the CV sources, so an unchanged CV rebuilds byte-identical PDFs)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Python runtime and dependencies
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pip
      - run: |
          pip install -r requirements.txt

      # XeLaTeX for the CV PDF renderer (cv/build.py)
      - name: Install TeX Live (XeTeX)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern

      # Render the two CV PDFs from cv/data/cv.yml into docs/assets/doc/
      - name: Build CV PDFs
        run: |
          python cv/build.py

      # Fail loudly if either PDF is missing, so we never deploy a dead download link
      - name: Verify CV PDFs were generated
        run: |
          test -f docs/assets/doc/sandmann-academic.pdf
          test -f docs/assets/doc/sandmann-resume.pdf

      # Commit the regenerated PDFs back to the repo
      - name: Commit CV PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/doc/sandmann-academic.pdf docs/assets/doc/sandmann-resume.pdf
          git diff --staged --quiet || git commit -m "chore: update CV PDFs [skip ci]"
          git push

      # Build the site with Zensical.
      # WORKAROUND (gambiarra): Zensical has no git-revision-date-localized yet and TOML has no
      # env-var substitution, so the "Last update" date (the pushed commit's date) is written
      # into zensical.toml (extra.last_update -> overrides/partials/source-file.html) right
      # before the build. The edit is not committed. Drop this once Zensical supports the plugin.
      - name: Build site
        run: |
          LAST_UPDATE="$(git log -1 --format=%cd --date=format:'%B %-d, %Y' ${{ github.sha }})"
          echo "Last update: $LAST_UPDATE"
          sed -i "s/^last_update = \"\"$/last_update = \"$LAST_UPDATE\"/" zensical.toml
          grep -q "^last_update = \"$LAST_UPDATE\"$" zensical.toml || { echo "last_update not set in zensical.toml"; exit 1; }
          zensical build --strict

      # Deploy to GitHub Pages (force-push site/ to the gh-pages branch, as mkdocs gh-deploy did)
      - name: Deploy
        run: |
          pip install ghp-import
          ghp-import --no-jekyll --push --force site
