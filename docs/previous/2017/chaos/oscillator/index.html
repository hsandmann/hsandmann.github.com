<html>
<head><meta charset="utf-8"><meta name="robots" content="noindex, follow">
	<link rel="stylesheet" type="text/css" href="../vis/vis.min.css">
	<script src="../vis/vis.min.js"></script>
	<script src="../math.js"></script>
	<script>

	var data = null;
	var graph = null;

	// Called when the Visualization API is loaded.

	function drawVisualization() {
		// Create and populate a data table.
		data = new vis.DataSet();

		// create some nice looking data with sin/cos
		var N = 300;
		var step = 0.005;
		var d = [1, 1, 1];

		var ode = new ODE(new Rossler());

		for (var i = 0; i <= N/step; i++) {
			data.add({x: d[0], y: d[1], z: d[2]});
			d = ode.rk4(d, step);
		}
		
		// specify options
		var options = {
			width:  '600px',
			height: '600px',
			style: 'line',
			showPerspective: false,
			showGrid: true,
			keepAspectRatio: true,
			verticalRatio: 1.0
		};

		// create our graph
		var container = document.getElementById('mygraph');
		graph = new vis.Graph3d(container, data, options);

		graph.setCameraPosition(0.4, undefined, undefined);
	}

	</script>
	<style>

	</style>
</head>
<body>
	<select id="listFunctions"></select><br>

	<div id='box-x0'>
		<input id='x0' type='range' orientation='vertical' min='0' max='100'><br>
	</div>

	<canvas id="canvasSinal" width=480 height=200></canvas>
	<canvas id="canvasWebDiagram" width=200 height=200></canvas>
	<div id='box-mu'>
		<input id='mu' type='range' min='0' max='100' style="width: 700px;">
	</div>
	<canvas id="canvasBifurcationMap" width=700 height=400></canvas><br>
	<canvas id="canvasLyapunovMap" width=700 height=100></canvas>
</body>
</html>
