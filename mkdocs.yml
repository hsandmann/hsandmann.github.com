site_name: Humberto Sandmann
repo_url: https://github.com/hsandmann/hsandmann.github.com
repo_name: hsandmann.github.com

theme:
  name: material
  # Keep the Material for MkDocs look; Zensical's default "modern" variant changes fonts,
  # header colors and link styling that docs/stylesheets/extra.css was tuned against.
  variant: classic
  custom_dir: overrides
  palette:
    # primary: grey
    # Light mode
    - scheme: default
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: grey
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
  features:
    # - announce.dismiss
    - content.tooltips
    - header.autohide
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
  favicon: assets/img/favicon.svg
  logo: assets/img/logo.svg
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      # quote: fontawesome/solid/quote-left
      quote: fontawesome/solid/book
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - footnotes
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - toc:
      title: Humberto Sandmann

plugins:
  # Zensical enables search by default; this is a single page, so it adds nothing.
  - search:
      enabled: false
  - minify:
      minify_html: true

# WORKAROUND (gambiarra): Zensical does not support git-revision-date-localized yet
# (listed as "Planned" at https://zensical.org/compatibility/plugins/). Until it does, CI
# exports SITE_LAST_UPDATE (date of the pushed commit) and overrides/partials/source-file.html
# renders it. Local builds leave it empty, so no date is shown. Replace this with the native
# plugin (and delete the override) once a viable alternative exists.
extra:
  last_update: !ENV [SITE_LAST_UPDATE, ""]

# The downloadable CVs (sandmann-academic.pdf / sandmann-resume.pdf) are generated from
# cv/data/cv.yml by cv/build.py (run in CI), not by a Zensical plugin.

extra_css:
  - stylesheets/extra.css
